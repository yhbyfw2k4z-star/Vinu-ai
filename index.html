<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vinu AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#080614;
  color:white;
}

header{
  padding:28px 25px 22px;
  border-bottom:1px solid #29213f;
}

.logo{
  display:flex;
  align-items:center;
  gap:18px;
}

.logoIcon{
  width:64px;
  height:64px;
  border-radius:20px;
  background:#7135e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}

.logo h1{
  margin:0;
  font-size:38px;
}

.logo p{
  margin:5px 0 0;
  color:#aaa6b5;
  font-size:18px;
}

main{
  padding:70px 25px 150px;
  max-width:900px;
  margin:auto;
}

.welcome{
  text-align:center;
}

.welcome h2{
  font-size:48px;
  margin:0 0 25px;
}

.welcome p{
  color:#aaa6b5;
  font-size:25px;
  margin-bottom:55px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.quick{
  background:#151126;
  border:1px solid #38285f;
  color:white;
  border-radius:25px;
  padding:25px;
  font-size:25px;
  cursor:pointer;
}

.quick:active{
  transform:scale(.98);
}

#chat{
  margin-top:45px;
}

.msg{
  display:flex;
  margin:18px 0;
}

.msg.user{
  justify-content:flex-end;
}

.bubble{
  max-width:80%;
  padding:18px 22px;
  border-radius:22px;
  font-size:19px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user .bubble{
  background:#7135e8;
}

.ai .bubble{
  background:#151126;
  border:1px solid #38285f;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#080614;
  border-top:1px solid #29213f;
  padding:18px 25px;
}

.inputArea{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:18px;
}

#input{
  flex:1;
  min-width:0;
  background:#151126;
  border:1px solid #38285f;
  border-radius:22px;
  color:white;
  padding:20px;
  font-size:19px;
  outline:none;
}

#send{
  width:150px;
  border:0;
  border-radius:22px;
  background:#7135e8;
  color:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.footer{
  text-align:center;
  color:#77717f;
  margin-top:15px;
}

@media(max-width:600px){

  .logo h1{
    font-size:30px;
  }

  .logo p{
    font-size:16px;
  }

  main{
    padding-top:50px;
  }

  .welcome h2{
    font-size:40px;
  }

  .welcome p{
    font-size:20px;
  }

  .buttons{
    gap:14px;
  }

  .quick{
    padding:20px 8px;
    font-size:20px;
  }

  .inputArea{
    gap:10px;
  }

  #send{
    width:110px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logoIcon">✦</div>

    <div>
      <h1>Vinu AI</h1>
      <p>Tumhara personal AI assistant</p>
    </div>
  </div>
</header>


<main>

  <div class="welcome">
    <h2>Namaste 👋</h2>

    <p>
      Main Vinu AI hoon. Mujhse kuch bhi poochho.
    </p>
  </div>


  <div class="buttons">

    <button class="quick"
      onclick="quickAsk('Mujhe ek motivation do')">
      💜 Motivation
    </button>

    <button class="quick"
      onclick="quickAsk('Mujhe ek interesting story sunao')">
      📖 Story
    </button>

    <button class="quick"
      onclick="quickAsk('Mujhe padhai ke liye help karo')">
      📚 Study
    </button>

    <button class="quick"
      onclick="quickAsk('Mujhe kuch creative ideas do')">
      ✨ Ideas
    </button>

  </div>


  <div id="chat"></div>

</main>


<div class="bottom">

  <div class="inputArea">

    <input
      id="input"
      type="text"
      placeholder="Vinu se kuch poochho..."
      autocomplete="off"
    >

    <button id="send" onclick="send()">
      Send
    </button>

  </div>

  <div class="footer">
    Vinu AI • Powered by Gemini
  </div>

</div>


<script>

const API_KEY_NAME = "VINU_GEMINI_KEY";


function add(text, who){

  const chat = document.getElementById("chat");

  const msg = document.createElement("div");
  msg.className = "msg " + who;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.textContent = text;

  msg.appendChild(bubble);
  chat.appendChild(msg);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


function quickAsk(text){

  document.getElementById("input").value = text;

  send();
}


async function send(){

  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");

  const text = input.value.trim();

  if(!text){
    return;
  }


  add(text, "user");

  input.value = "";

  sendButton.disabled = true;
  sendButton.textContent = "Thinking...";


  let apiKey = localStorage.getItem(API_KEY_NAME);


  if(!apiKey){

    apiKey = prompt(
      "Vinu AI chalane ke liye apni Gemini API Key paste karo:"
    );

    if(!apiKey){

      add(
        "API key nahi mili 😕",
        "ai"
      );

      sendButton.disabled = false;
      sendButton.textContent = "Send";

      return;
    }

    apiKey = apiKey.trim();

    localStorage.setItem(
      API_KEY_NAME,
      apiKey
    );
  }


  add(
    "Soch raha hoon... 💜",
    "ai"
  );


  try{

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
      encodeURIComponent(apiKey),
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          system_instruction:{
            parts:[
              {
                text:
                "Tum Vinu AI ho. " +
                "Tum ek friendly personal AI assistant ho. " +
                "User ko Hindi ya Hinglish mein simple, " +
                "natural aur helpful jawab do. " +
                "User jo pooche uska seedha jawab do."
              }
            ]
          },

          contents:[
            {
              role:"user",

              parts:[
                {
                  text:text
                }
              ]
            }
          ]

        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      if(
        data &&
        data.error &&
        data.error.message
      ){

        throw new Error(
          data.error.message
        );

      }

      throw new Error(
        "Gemini API request failed"
      );
    }


    const answer =
      data &&
      data.candidates &&
      data.candidates[0] &&
      data.candidates[0].content &&
      data.candidates[0].content.parts &&
      data.candidates[0].content.parts[0] &&
      data.candidates[0].content.parts[0].text;


    if(!answer){

      throw new Error(
        "AI ka answer nahi mila."
      );
    }


    const chat =
      document.getElementById("chat");

    const aiMessages =
      chat.querySelectorAll(".msg.ai");

    const lastAI =
      aiMessages[aiMessages.length - 1];

    if(lastAI){

      const bubble =
        lastAI.querySelector(".bubble");

      bubble.textContent = answer;

    }else{

      add(answer, "ai");

    }


  }catch(error){

    console.error(error);


    const chat =
      document.getElementById("chat");

    const aiMessages =
      chat.querySelectorAll(".msg.ai");

    const lastAI =
      aiMessages[aiMessages.length - 1];


    let message =
      "Sorry, Vinu AI answer nahi de paaya 😕";


    if(error.message){

      message +=
        "\n\nError: " +
        error.message;
    }


    if(lastAI){

      const bubble =
        lastAI.querySelector(".bubble");

      bubble.textContent = message;

    }else{

      add(message, "ai");

    }

  }


  sendButton.disabled = false;
  sendButton.textContent = "Send";
}


document
  .getElementById("input")
  .addEventListener("keydown", function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      send();
    }

  });

</script>

</body>
</html>
