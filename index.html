<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinu AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0818;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:22px 20px 14px;
  border-bottom:1px solid #29233d;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#7c3aed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.name{
  font-size:22px;
  font-weight:800;
}

.sub{
  color:#aaa;
  font-size:12px;
}

main{
  flex:1;
  padding:20px 18px 120px;
  max-width:700px;
  width:100%;
  margin:auto;
}

.welcome{
  text-align:center;
  margin:30px 0;
}

.welcome h1{
  margin:0 0 8px;
  font-size:28px;
}

.welcome p{
  color:#aaa;
}

.chips{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.chip{
  background:#171229;
  border:1px solid #30264d;
  color:#ddd;
  border-radius:14px;
  padding:13px;
  text-align:center;
}

.msg{
  display:flex;
  margin:12px 0;
}

.bubble{
  max-width:88%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  justify-content:flex-end;
}

.user .bubble{
  background:#6d28d9;
}

.ai .bubble{
  background:#171229;
  border:1px solid #30264d;
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0b0818;
  border-top:1px solid #29233d;
  padding:12px;
}

.row{
  display:flex;
  gap:9px;
  max-width:700px;
  margin:auto;
}

input{
  flex:1;
  background:#171229;
  color:white;
  border:1px solid #3b3157;
  border-radius:14px;
  padding:14px;
  outline:none;
}

button{
  border:0;
  border-radius:14px;
  padding:0 18px;
  background:#7c3aed;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.small{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div>
      <div class="name">Vinu AI</div>
      <div class="sub">Tumhara personal AI assistant</div>
    </div>
  </div>
</header>

<main>

<div class="welcome">
  <h1>Namaste 👋</h1>
  <p>Main Vinu AI hoon. Mujhse kuch bhi poochho.</p>
</div>

<div class="chips">
  <div class="chip" onclick="quick('Mujhe motivate karo')">💜 Motivation</div>
  <div class="chip" onclick="quick('Mere liye ek story likho')">📖 Story</div>
  <div class="chip" onclick="quick('Mujhe padhai mein help karo')">📚 Study</div>
  <div class="chip" onclick="quick('Aaj ka din productive kaise banao?')">✨ Ideas</div>
</div>

<div id="chat"></div>

</main>

<div class="composer">
  <div class="row">
    <input id="input" placeholder="Vinu se kuch poochho..." 
           onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
  <div class="small">Vinu AI • Powered by Gemini</div>
</div>

</div>

<script>

const KEY_NAME = "vinu_gemini_key";

function add(text,who="ai"){
  const chat=document.getElementById("chat");

  const msg=document.createElement("div");
  msg.className="msg "+who;

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;

  msg.appendChild(bubble);
  chat.appendChild(msg);

  window.scrollTo(0,document.body.scrollHeight);
}

function quick(text){
  document.getElementById("input").value=text;
  send();
}

async function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();

  if(!text)return;

  add(text,"user");
  input.value="";

  let key=localStorage.getItem(KEY_NAME);

  if(!key){
    key=prompt("");

    if(!key){
      add("API key nahi mili 😕");
      return;
    }

    localStorage.setItem(KEY_NAME,key.trim());
  }

  add("Soch raha hoon... 💜","ai");

  try{

    const response=await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
      +encodeURIComponent(key),
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          contents:[
            {
              parts:[
                {
                  text:
                  "Tum Vinu AI ho, ek friendly personal AI assistant. " +
                  "User ko Hindi/Hinglish mein simple aur helpful jawab do.\n\n" +
                  "User: "+text
                }
              ]
            }
          ]
        })
      }
    );

    const data=await response.json();

    const answer=
      data?.candidates?.[0]?.content?.parts?.[0]?.text
      ||"Sorry, abhi answer nahi mil paaya 😕";

    const msgs=document.querySelectorAll(".msg.ai");

    if(msgs.length){
      msgs[msgs.length-1].querySelector(".bubble").textContent=answer;
    }

  }catch(error){

    const msgs=document.querySelectorAll(".msg.ai");

    if(msgs.length){
      msgs[msgs.length-1].querySelector(".bubble").textContent=
        "Connection error 😔 API key check karo.";
    }
  }
}

</script>

</body>
</html>
